# Remap keyboard shortcuts
remap:
  t: cmd+t # prevent double-modifier on adding tracks
  cmd+t: cmd+shift+t # prevent double-modifier on adding tracks
  cmd+shift+e: tilePluginWindows
  cmd+w: closeFocusedPlugin
  cmd+shift+w: closeAllPlugins
  cmd+shift+o: openAllPlugins
  d: delete
  shift+d: 0
  cmd+shift+b: cmd+shift+t, plugin.Serum_2 # NOTE: replace spaces with underscores in plugin names
  cmd+shift+c: cmd+shift+m # new MIDI "clip"
  cmd+b: cmd+d, cmd+d, cmd+d, cmd+d # LES-style "buplicate"
  f: cmd+j # f for "fuse"
  cmd+y: searchbox # plugin quick access box
  uparrow: uparrow
  downarrow: downarrow
  leftarrow: leftarrow
  rightarrow: rightarrow
  cmd+h: h
  h: leftarrow
  j: downarrow
  k: uparrow
  l: rightarrow
  shift+h: leftarrow
  shift+j: downarrow
  shift+k: uparrow
  shift+l: rightarrow

# Plugins
rename-plugins:
  Serum: Daddy Duda's Special Synth

remove-plugins:
  - TerribleSynth
  - I'mTooLazyToUninstallSynth

# Application behavior
init:
  retries: 10

window:
  - search: 100,200,500,500
  - preferences: 50,150,200,300
